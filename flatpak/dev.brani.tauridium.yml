# Publication reference: validate its source/inputs with just flatpak-publication-check.
# Local development uses just flatpak-build; publication uses the immutable tag/commit below.
id: dev.brani.tauridium
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: tauridium
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
  # Only the standard OS credential vault; no unrestricted session-bus access.
  - --talk-name=org.freedesktop.secrets
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
modules:
  # Vendored from flathub/shared-modules at cb9ec602a1ece1c76d5a4f8aa1d87c4a6bf99c3e.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: tauri-cli
    buildsystem: simple
    cleanup:
      - /bin/cargo-tauri
    build-options:
      env:
        CARGO_HOME: /run/build/tauri-cli/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - python3 prepare-tauri-cli.py --cli tauri-cli.crate --bundler tauri-bundler.crate --policy build-toolchain.json --lock tauri-cli.Cargo.lock --output tauri-cli
      - cargo build --manifest-path tauri-cli/Cargo.toml --release --locked --offline
      - install -Dm755 tauri-cli/target/release/cargo-tauri /app/bin/cargo-tauri
    sources:
      - type: file
        url: https://static.crates.io/crates/tauri-cli/tauri-cli-2.12.3.crate
        sha256: 9a6f47e865c7c526880d9e3a0c4bb84255d6e3f45fac2684adf82458ee565a18
        dest-filename: tauri-cli.crate
      - type: file
        url: https://static.crates.io/crates/tauri-bundler/tauri-bundler-2.10.3.crate
        sha256: d8d64a12aad47ee51ea5d6326ae90026946866ed64062dd0f4fc04fda6bb1221
        dest-filename: tauri-bundler.crate
      - type: file
        path: prepare-tauri-cli.py
      - type: file
        path: tauri-cli.Cargo.lock
      - type: file
        path: tauri-cli-policy.json
        dest-filename: build-toolchain.json
      - tauri-cli-cargo-sources.json

  - name: tauridium
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/tauridium/cargo
        CARGO_NET_OFFLINE: 'true'
        npm_config_cache: /run/build/tauridium/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - cd source && npm ci --offline --ignore-scripts --cache=/run/build/tauridium/flatpak-node/npm-cache
      - cd source && npm run build
      - chmod +x source/flatpak/cargo-flatpak-runner.sh
      - cd source && cargo tauri build --runner ../flatpak/cargo-flatpak-runner.sh --no-bundle --ci
      - install -Dm755 source/src-tauri/target/release/tauridium /app/bin/tauridium
      - install -Dm644 source/data/dev.brani.tauridium.desktop /app/share/applications/dev.brani.tauridium.desktop
      - install -Dm644 source/data/dev.brani.tauridium.metainfo.xml /app/share/metainfo/dev.brani.tauridium.metainfo.xml
      - install -Dm644 source/data/dev.brani.tauridium.svg /app/share/icons/hicolor/scalable/apps/dev.brani.tauridium.svg
      - install -Dm644 source/LICENSE /app/share/licenses/dev.brani.tauridium/LICENSE
    sources:
      - type: git
        url: https://github.com/Akkitto/Tauridium.git
        tag: v1.0.0
        commit: a760ba14c63ec2d3b3dfe2503603da53e3b39e43
        dest: source
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
      - node-sources.json
