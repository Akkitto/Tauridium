# Replace the implicit all-local default with existing app UI commands only.
# This is not an OS shell/process plugin permission. Service children get none.
[[permission]]
identifier = "app-ui"
description = "Existing application commands for the trusted main UI only"
commands.allow = [
  "login",
  "start_local_session",
  "restore_session",
  "get_services",
  "get_workspaces",
  "show_service",
  "preload_service",
  "get_service_icon",
  "copy_service_icon_cache",
  "fetch_workspace_icon_url",
  "fetch_service_icon_url",
  "hide_all_services",
  "close_service",
  "set_sidebar_width",
  "set_presentation_titles",
  "close_services",
  "logout",
  "set_service_flags",
  "update_service",
  "create_service",
  "create_custom_website_service",
  "delete_service",
  "clear_service_cache",
  "clear_sandbox",
  "list_recipes",
  "get_recipe_storage_info",
  "save_custom_recipe",
  "import_custom_recipe",
  "create_workspace",
  "update_workspace",
  "delete_workspace",
  "get_app_settings",
  "set_service_order",
  "set_workspace_order",
  "sync_services_menu",
  "set_app_settings",
  "get_distribution_info",
  "export_backup",
  "create_automatic_backup",
  "restore_backup",
  "export_portable_bundle",
  "export_service_bundle",
  "record_updater_error",
  "check_native_update",
  "install_native_update",
  "get_audit_log",
  "get_audit_log_page",
  "export_audit_log",
  "clear_audit_log",
  "open_external_url",
  "get_app_metadata",
  "reload_active_service_command",
  "reload_app_command",
  "show_service_toast_overlay",
  "set_service_zoom",
  "toggle_devtools_command"
]

[[permission]]
identifier = "download-toast"
description = "Notification renderer can only access its own notification state"
commands.allow = [
  "get_download_toast",
  "dismiss_download_toast",
  "resize_download_toast"
]

