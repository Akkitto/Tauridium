[package]
name = "tauridium"
version = "0.8.1"
edition = "2021"
rust-version = "1.97.1"
description = "Tauridium — lightweight Tauri client for Ferdium"
authors = ["Daniel Braniewski"]
homepage = "https://github.com/Akkitto/Tauridium"
repository = "https://github.com/Akkitto/Tauridium"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["native-distribution"]
native-distribution = [
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-updater",
  "rfd/gtk3",
  "tauri-plugin-dialog/gtk3",
]
flatpak = [
  "dep:zbus",
  "zbus/tokio",
  "tauri-plugin-dialog/xdg-portal",
  "rfd/xdg-portal",
  "rfd/wayland",
  "rfd/tokio",
]

[dependencies]
# `devtools` keeps open/close/is_devtools_open available in release builds too.
# Without it, the Toggle Developer Tools menu is inert outside development builds.
tauri = { version = "=2.11.3", features = ["unstable", "tray-icon", "devtools"] }
# Direct access to Wry's low-level API (macOS remove_data_store) to purge the
# WKWebsiteDataStore of a removed service. Patched to ../vendor/wry.
wry = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
# zip intentionally disables defaults; select flate2's portable Rust backend explicitly.
# This must remain unconditional so Windows cannot depend on platform-specific feature unification.
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
zbus = { version = "5.16.0", optional = true }
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
# The distribution feature deliberately selects the Linux dialog backend. Native
# packages retain GTK3; Flatpak enables xdg-portal + Wayland + Tokio explicitly.
# Keeping the dependency itself featureless prevents accidental Cargo feature
# unification from silently changing either distribution mode.
tauri-plugin-dialog = { version = "2", default-features = false }
rfd = { version = "0.16", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2"
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.59, <=0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "tauridium"
path = "src/main.rs"

# Patched Wry: mutable window.ipc allows injection of the Electron IPC shim (for example Synology Chat).
# See vendor/wry/src/wkwebview/mod.rs. Reapply the patch when upgrading Wry.
#
# TEMPORARY patched Tauri 2.11.3: makes only the generic `window.isTauri` marker configurable
# so Tauridium can hide it in selected Proton web-client service webviews. The marker remains
# true everywhere else and no IPC/ACL behavior is changed. Remove this path patch with
# src/proton_compat.rs once Proton fixes its upstream environment detection.
[patch.crates-io]
tauri = { path = "../vendor/tauri" }
wry = { path = "../vendor/wry" }
