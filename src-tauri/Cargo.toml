[package]
name = "tauridium"
version = "0.3.13"
edition = "2021"
description = "Tauridium — lightweight Tauri client for Ferdium"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps open/close/is_devtools_open available in release builds too.
# Without it, the Toggle Developer Tools menu is inert outside development builds.
tauri = { version = "2", features = ["unstable", "tray-icon", "devtools"] }
# Direct access to Wry's low-level API (macOS remove_data_store) to purge the
# WKWebsiteDataStore of a removed service. Patched to ../vendor/wry.
wry = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

[[bin]]
name = "tauridium"
path = "src/main.rs"

# Patched Wry: mutable window.ipc allows injection of the Electron IPC shim (for example Synology Chat).
# See vendor/wry/src/wkwebview/mod.rs. Reapply the patch when upgrading Wry.
[patch.crates-io]
wry = { path = "../vendor/wry" }
