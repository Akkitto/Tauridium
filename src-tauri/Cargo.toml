[package]
name = "tauridium"
version = "0.6.7"
edition = "2021"
rust-version = "1.97.1"
description = "Tauridium — lightweight Tauri client for Ferdium"
authors = ["Daniel Braniewski"]
homepage = "https://github.com/Akkitto/Tauridium"
repository = "https://github.com/Akkitto/Tauridium"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps open/close/is_devtools_open available in release builds too.
# Without it, the Toggle Developer Tools menu is inert outside development builds.
tauri = { version = "2", features = ["unstable", "tray-icon", "devtools"] }
# Direct access to Wry's low-level API (macOS remove_data_store) to purge the
# WKWebsiteDataStore of a removed service. Patched to ../vendor/wry.
wry = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# Direct synchronous save dialogs for WebView download callbacks. This is the same
# backend used by tauri-plugin-dialog, but its blocking wrapper cannot run inside the
# synchronous main-thread download-start callback without deadlocking.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.59, <=0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[[bin]]
name = "tauridium"
path = "src/main.rs"

# Patched Wry: mutable window.ipc allows injection of the Electron IPC shim (for example Synology Chat).
# See vendor/wry/src/wkwebview/mod.rs. Reapply the patch when upgrading Wry.
[patch.crates-io]
wry = { path = "../vendor/wry" }
