name: Security gates

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  security:
    name: Current advisories and artifact-secret controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Enforce hook-free install and current npm advisories
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=low
      - name: Install exact advisory scanner without signing credentials
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("data/build-toolchain.json"))["cargoAudit"])')"
          cargo install cargo-audit --locked --version "$VERSION"
      - name: Audit actual application and published builder locks against fresh RustSec
        run: python3 tools/audit_dependencies.py
      - name: Install checksum-verified official artifact scanners
        run: python3 tools/security_tools.py "$RUNNER_TEMP/security-tools"
      - name: Install data-only package readers and real OCR test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends msitools wixl tesseract-ocr imagemagick fonts-dejavu-core
          command -v msiinfo
          command -v wixl
          command -v tesseract
          command -v convert
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
      - name: Exercise actual scanners with harmless and deliberately seeded controls
        env:
          TAURIDIUM_ARTIFACT_SECURITY_TOOLS: ${{ runner.temp }}/security-tools
        run: python3 -m unittest discover -s tools -p test_artifact_security.py
      # Raw diagnostic/secret reports and synthetic credential corpora are never uploaded.
