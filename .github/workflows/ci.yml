name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  security:
    uses: ./.github/workflows/security.yml

  nix:
    uses: ./.github/workflows/nix.yml

  linux:
    name: Linux full gates
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Initialize
        run: just init
      - name: Scan Cargo cache for known malicious crates
        run: just rust-supply-chain-host
      - name: Run canonical gates
        run: just ci

  windows-verifier:
    name: Windows verifier ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            os: windows-latest
          - label: ARM64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Bootstrap without package managers and verify actual signatures
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/test_windows_minisign.ps1

  windows-native:
    needs: windows-verifier
    if: ${{ always() }}
    name: Windows native x64 full gates
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require both Windows verifier checks
        run: |
          if ("${{ needs.windows-verifier.result }}" -ne "success") {
            throw "Both native Windows verifier checks must pass"
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Verify native PowerShell initialization path
        run: just init-self-test
      - name: Initialize
        run: just init
      - name: Scan Cargo cache for known malicious crates
        run: just rust-supply-chain-host
      - name: Run canonical gates
        run: just ci
