name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  security:
    uses: ./.github/workflows/security.yml

  nix:
    uses: ./.github/workflows/nix.yml

  linux:
    name: Linux full gates
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Initialize
        run: just init
      - name: Scan Cargo cache for known malicious crates
        run: just rust-supply-chain-host
      - name: Run canonical gates
        run: just ci

  windows-verifier:
    name: Windows verifier ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            os: windows-latest
          - label: ARM64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Bootstrap without package managers and verify actual signatures
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/test_windows_minisign.ps1

  windows-native:
    needs: windows-verifier
    if: ${{ always() }}
    name: Windows native x64 full gates
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require both Windows verifier checks
        run: |
          if ("${{ needs.windows-verifier.result }}" -ne "success") {
            throw "Both native Windows verifier checks must pass"
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Verify native PowerShell initialization path
        run: just init-self-test
      - name: Initialize
        run: just init
      - name: Scan Cargo cache for known malicious crates
        run: just rust-supply-chain-host
      - name: Run canonical gates
        run: just ci
