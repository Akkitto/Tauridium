name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel previous runs on the same ref to avoid stacking redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Silence Node deprecation warnings (punycode / url.parse) emitted by third-party actions
# such as rust-cache/setup-node on Node 24; they are outside this project.
env:
  NODE_OPTIONS: --no-deprecation

jobs:
  frontend:
    name: Frontend (check · test · build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (svelte-check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux WebView deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"
      - name: Production release build
        run: cargo tauri build --no-bundle --ci

  # The Rust job above runs on Ubuntu, so it does NOT compile platform-specific
  # #[cfg(target_os = "macos" | "windows")] blocks such as data_store_identifier and tray.
  # Platform-specific compile regressions would otherwise only appear during a tagged
  # release. This matrix cargo-check job catches them on every push.
  rust-cross:
    name: Rust check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked

  windows-native:
    name: Windows native (PowerShell · full gates)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install just
        run: |
          winget install --id Casey.Just --exact --source winget --accept-source-agreements --accept-package-agreements
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          just --version
      - name: Verify native PowerShell initialization path
        run: just init-self-test
      - run: just init-native
      - name: Install frontend dependencies
        run: npm ci
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Check
        run: just check
      - name: Tests
        run: just test
      - name: Release build
        run: just build
      - name: Package local release
        run: just package
