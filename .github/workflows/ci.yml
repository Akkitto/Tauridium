name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Annule les runs précédents sur la même ref (évite d'empiler les builds).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tait les DeprecationWarning de Node (punycode / url.parse) émis par les actions
# tierces (rust-cache, setup-node) sur Node 24 — non corrigeables de notre côté.
env:
  NODE_OPTIONS: --no-deprecation

jobs:
  frontend:
    name: Frontend (check · test · build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (svelte-check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux WebView deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Release build
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --all-features

  # Le job `rust` ci-dessus tourne sur Ubuntu : il NE compile PAS les blocs
  # #[cfg(target_os = "macos" | "windows")] (data_store_identifier, tray…). Une
  # régression de compilation propre à ces plateformes ne se verrait qu'au tag de
  # release. Ce job `cargo check` matriciel l'attrape dès le push.
  rust-cross:
    name: Rust check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features

  windows-native:
    name: Windows native (PowerShell · full gates)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install just
        run: |
          winget install --id Casey.Just --exact --source winget --accept-source-agreements --accept-package-agreements
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          just --version
      - name: Verify native PowerShell initialization path
        run: just init-self-test
      - run: just init-native
      - name: Install frontend dependencies
        run: npm ci
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Check
        run: just check
      - name: Tests
        run: just test
      - name: Release build
        run: just build
      - name: Package local release
        run: just package
