name: WinGet acceptance

on:
  push:
    branches: [master]
    paths:
      - 'packaging/winget/**'
      - 'tools/*winget*'
      - '.github/workflows/winget.yml'
  pull_request:
    paths:
      - 'packaging/winget/**'
      - 'tools/*winget*'
      - '.github/workflows/winget.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Native installer checks, or real catalog checks after publication'
        type: choice
        required: true
        default: native
        options: [native, catalog]

permissions:
  contents: read

concurrency:
  group: winget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: WinGet ${{ inputs.mode || 'native' }} ${{ matrix.arch }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Exercise verified release installers through WinGet
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/test_winget_install.ps1 -Architecture '${{ matrix.arch }}' -Mode '${{ inputs.mode || 'native' }}'
