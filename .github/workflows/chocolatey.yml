name: Local Chocolatey acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Chocolatey local ${{ matrix.arch }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify local packaging and native MSI lifecycle
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/test_chocolatey_install.ps1 -Architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chocolatey-local-${{ matrix.arch }}
          path: release/chocolatey/acceptance-${{ matrix.arch }}/*.nupkg
          retention-days: 3
          if-no-files-found: error
  scan:
    name: Chocolatey decoded package security
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chocolatey-local-*
          path: release/chocolatey-inputs
      - name: Install pinned data-only scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends msitools
          python3 tools/security_tools.py "$RUNNER_TEMP/security-tools"
      - name: Scan exact local packages including embedded MSI payloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('release/chocolatey-inputs'); output=Path('release/chocolatey-scan'); output.mkdir()
          assert {p.name for p in source.iterdir()}=={'chocolatey-local-x64','chocolatey-local-arm64'}
          for directory in source.iterdir():
              files=list(directory.iterdir())
              assert len(files)==2 and all(p.is_file() and not p.is_symlink() and p.suffix=='.nupkg' for p in files)
              for p in files: shutil.copyfile(p,output/(directory.name+'-'+p.name))
          PY
          python3 tools/artifact_security.py release/chocolatey-scan --tools "$RUNNER_TEMP/security-tools"
