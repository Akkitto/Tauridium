name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  security:
    uses: ./.github/workflows/security.yml

  nix:
    uses: ./.github/workflows/nix.yml

  gate:
    name: Release gates
    needs: security
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Initialize build environment
        run: just init
      - name: Scan Cargo cache for known malicious crates
        run: just rust-supply-chain-host
      - name: Verify tag and master ancestry
        shell: bash
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git fetch origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Verify existing owner-protected release environments
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY_SCOPE_CONFIRMED: ${{ vars.RELEASE_KEY_SCOPE_CONFIRMED }}
        run: python3 tools/release_environment.py
      - name: Run canonical release gates
        run: just ci

  handoff:
    name: Stage release handoff
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Build deterministic source/documentation handoff
        run: |
          just package-handoff
          just release-notes
      - name: Stage handoff as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-handoff
          if-no-files-found: error
          compression-level: 0
          path: |
            release/tauridium-*-src.zip
            release/tauridium-*-doc.zip
            release/tauridium-*-run-build-handoff.zip
            release/release-notes.md

  build:
    name: Build ${{ matrix.label }}
    needs: gate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify clean-machine Windows signature tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/test_windows_minisign.ps1
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install just (Linux)
        if: runner.os == 'Linux'
        run: cargo install just --locked --version 1.56.0
      - name: Install just (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo install just --locked --version 1.56.0
      - name: Verify Windows-native bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: just init-self-test
      - name: Initialize build environment
        run: just init
      - name: Scan Cargo cache for known malicious crates
        run: just rust-supply-chain-host
      - name: Run native Windows security and application gates
        if: runner.os == 'Windows'
        run: just quality
      - name: Build native bundles without any signing credentials
        run: just bundle-target ${{ matrix.target }}
      - name: Collect exact unsigned native asset set
        run: just package-native ${{ matrix.target }}
      - name: Verify portable Windows package
        if: runner.os == 'Windows'
        run: just scoop-verify-collected ${{ matrix.target }}
      - name: Stage native assets as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          path: release/native/*

  scoop:
    name: Scoop clean-machine ${{ matrix.label }}
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_arch: x64
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939 # v0.5.3
          path: .scoop-core
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download staged portable package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.target }}
          path: release/scoop-assets
      - name: Verify downloaded portable package
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/python.ps1 tools/scoop.py verify-collected --assets-dir release/scoop-assets --target ${{ matrix.target }}
      - name: Verify Scoop install, update, uninstall, and reinstall
        run: |
          $portable = Get-ChildItem -LiteralPath release/scoop-assets -File `
            -Filter "tauridium-*-windows-${{ matrix.asset_arch }}-portable.zip"
          if ($portable.Count -ne 1) { throw 'Expected exactly one portable Tauridium ZIP.' }
          ./tools/test_scoop_install.ps1 `
            -ScoopCore .scoop-core `
            -Portable $portable.FullName `
            -Target '${{ matrix.target }}' `
            -PreviousVersion '0.0.0'

  verify:
    name: Keyless candidate verification
    needs: [handoff, build, scoop, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.seal.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download exact same-run artifacts without merged directories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release/inputs
      - name: Assemble bounded exact target inventories
        run: python3 tools/assemble_release.py release/inputs release/unsigned
      - name: Install pinned data-only scanners and MSI reader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends msitools
          python3 tools/security_tools.py "$RUNNER_TEMP/security-tools"
      - name: Scan all decoded candidates including binary and Git history
        run: python3 tools/artifact_security.py release/unsigned --tools "$RUNNER_TEMP/security-tools"
      - name: Seal unsigned input bytes for the fresh signer
        id: seal
        run: |
          DIGEST="$(python3 -I tools/release_snapshot.py seal release/unsigned --stage unsigned --commit "$GITHUB_SHA")"
          [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]]
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-unsigned
          path: release/unsigned/*
          compression-level: 0
          if-no-files-found: error

  sign:
    name: Protected minimal updater signing
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-signing
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install only the pinned official standalone signer before key custody
        run: python3 -I tools/security_tools.py "$RUNNER_TEMP/signer" --only minisign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-unsigned
          path: release/unsigned
      - name: Sign previously verified opaque bytes without build tools or artifact parsers
        id: sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INPUT_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          DIGEST="$(python3 -I tools/sign_release.py release/unsigned release/signed --minisign "$RUNNER_TEMP/signer/minisign" --input-sha256 "$INPUT_SHA256" --commit "$GITHUB_SHA")"
          [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]]
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-signed
          path: release/signed/*
          compression-level: 0
          if-no-files-found: error

  finalize:
    name: Keyless final snapshot and provenance
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.finalize.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-signed
          path: release/signed
      - name: Install pinned data-only scanners and MSI reader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends msitools
          python3 tools/security_tools.py "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Reverify signatures and generate complete metadata without any private keys
        id: finalize
        env:
          INPUT_SHA256: ${{ needs.sign.outputs.sha256 }}
        run: |
          DIGEST="$(python3 tools/finalize_release.py custody release/signed --output release/final --input-sha256 "$INPUT_SHA256" --commit "$GITHUB_SHA")"
          [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]]
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Scan the exact final public snapshot before attestation and promotion
        run: python3 tools/artifact_security.py release/final --tools "$RUNNER_TEMP/security-tools"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/final/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-public-snapshot
          path: release/final/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Protected hash-only publication
    needs: finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: final-public-snapshot
          path: release/final
      - name: Publish only the exact verified bytes through a private draft
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA256: ${{ needs.finalize.outputs.sha256 }}
        run: python3 -I tools/publish_release.py release/final --commit "$GITHUB_SHA" --input-sha256 "$INPUT_SHA256"
