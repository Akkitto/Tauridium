name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  gate:
    name: Release gates
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Initialize build environment
        run: just init
      - name: Scan Cargo cache for known malicious crates
        run: just rust-supply-chain-host
      - name: Verify tag and master ancestry
        shell: bash
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git fetch origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Run canonical release gates
        run: just ci

  handoff:
    name: Stage release handoff
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Build deterministic source/documentation handoff
        run: |
          just package-handoff
          just release-notes
      - name: Stage handoff as workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-handoff
          if-no-files-found: error
          compression-level: 0
          path: |
            release/tauridium-*-src.zip
            release/tauridium-*-doc.zip
            release/tauridium-*-run-build-handoff.zip
            release/release-notes.md

  build:
    name: Build ${{ matrix.label }}
    needs: gate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TAURI_UPDATER_SIGNING_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install just (Linux)
        if: runner.os == 'Linux'
        run: cargo install just --locked --version 1.56.0
      - name: Install just (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo install just --locked --version 1.56.0
      - name: Verify Windows-native bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: just init-self-test
      - name: Initialize build environment
        run: just init
      - name: Scan Cargo cache for known malicious crates
        run: just rust-supply-chain-host
      - name: Build native bundles with updater artifacts
        if: env.TAURI_UPDATER_SIGNING_ENABLED == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: just bundle-target ${{ matrix.target }}
      - name: Build native bundles without updater artifacts
        if: env.TAURI_UPDATER_SIGNING_ENABLED != 'true'
        run: just bundle-target-no-updater ${{ matrix.target }}
      - name: Collect and validate signed native assets
        if: env.TAURI_UPDATER_SIGNING_ENABLED == 'true'
        run: just package-native-signed ${{ matrix.target }}
      - name: Collect native assets without updater signatures
        if: env.TAURI_UPDATER_SIGNING_ENABLED != 'true'
        run: just package-native ${{ matrix.target }}
      - name: Verify portable Windows package
        if: runner.os == 'Windows'
        run: just scoop-verify-collected ${{ matrix.target }}
      - name: Stage native assets as workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          path: release/native/*

  scoop:
    name: Scoop clean-machine ${{ matrix.label }}
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_arch: x64
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: v0.5.3
          path: .scoop-core
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Download staged portable package
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-${{ matrix.target }}
          path: release/scoop-assets
      - name: Verify downloaded portable package
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/python.ps1 tools/scoop.py verify-collected --assets-dir release/scoop-assets --target ${{ matrix.target }}
      - name: Verify Scoop install, update, uninstall, and reinstall
        run: |
          $portable = Get-ChildItem -LiteralPath release/scoop-assets -File `
            -Filter "tauridium-*-windows-${{ matrix.asset_arch }}-portable.zip"
          if ($portable.Count -ne 1) { throw 'Expected exactly one portable Tauridium ZIP.' }
          ./tools/test_scoop_install.ps1 `
            -ScoopCore .scoop-core `
            -Portable $portable.FullName `
            -Target '${{ matrix.target }}' `
            -PreviousVersion '0.0.0'

  publish:
    name: Finalize release
    needs: [handoff, build, scoop]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install just
        run: cargo install just --locked --version 1.56.0
      - name: Download staged handoff assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-handoff
          path: release/published-assets
      - name: Download staged native assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: release/published-assets
          merge-multiple: true
      - name: Generate and validate release metadata
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          just updater-manifest-if-signed release/published-assets
          just scoop-release-manifest release/published-assets
          just scoop-validate-manifest "release/published-assets/tauridium-${VERSION}-scoop.json" release/published-assets
          just release-checksums release/published-assets
      - name: Publish verified release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME; refusing to mutate published assets." >&2
            exit 1
          fi
          mapfile -t files < <(
            find release/published-assets -maxdepth 1 -type f \
              ! -name 'release-notes.md' -print | sort
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No verified release assets were staged.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --latest \
            --title "Tauridium ${GITHUB_REF_NAME#v}" \
            --notes-file release/published-assets/release-notes.md
